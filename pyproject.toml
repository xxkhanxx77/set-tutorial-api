[project]
name = "settrade-bidask-railway"
version = "0.1.0"
description = "Railway-ready Settrade bid/ask 10-level collector with PostgreSQL storage."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "settrade-v2>=2.2.1",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
